name: Security Pipeline

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ============================================================
  # SECRETS SCANNING
  # ============================================================

  secrets-scanning:
    name: Secrets Scanning
    uses: ./.github/workflows/secrets-scanning.yml
    permissions:
      contents: read
      security-events: write


  # ============================================================
  # SAST
  # ============================================================

  sast:
    name: SAST
    uses: ./.github/workflows/sast.yml
    permissions:
      contents: read
      actions: read
      security-events: write


  # ============================================================
  # SECURITY GATE
  #
  # always() ensures this job executes even when one of the
  # scanning workflows reports a failure.
  # ============================================================

  security-gate:
    name: Security Gate

    needs:
      - secrets-scanning
      - sast

    if: always()

    uses: ./.github/workflows/security-gate.yml

    permissions:
      contents: read
      actions: read
