name: Secrets Scanning

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:

  # ============================================================
  # GITLEAKS
  # ============================================================

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      # ----------------------------------------------------------
      # Run Gitleaks
      #
      # --redact prevents actual secret values from appearing
      # in logs/reports.
      #
      # --exit-code=0 means Gitleaks itself does not stop the
      # workflow. The Security Gate will make the final decision.
      # ----------------------------------------------------------

      - name: Run Gitleaks
        id: gitleaks
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:latest \
            detect \
            --source=/repo \
            --report-format=sarif \
            --report-path=/repo/gitleaks.sarif \
            --redact \
            --exit-code=0


      # ----------------------------------------------------------
      # Validate report
      # ----------------------------------------------------------

      - name: Validate Gitleaks report
        if: always()
        run: |
          if [ ! -f gitleaks.sarif ]; then
            echo "::error::Gitleaks SARIF report was not generated."
            exit 1
          fi

          echo "Gitleaks SARIF report generated successfully."


      # ----------------------------------------------------------
      # Upload to GitHub Code Scanning
      # ----------------------------------------------------------

      - name: Upload Gitleaks SARIF to GitHub Code Scanning
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks


      # ----------------------------------------------------------
      # Upload SARIF as workflow artifact
      # ----------------------------------------------------------

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: error


      # ----------------------------------------------------------
      # Gitleaks summary
      #
      # This displays the exact:
      # - Rule
      # - File
      # - Line
      # - Description
      #
      # The secret value itself is NOT displayed.
      # ----------------------------------------------------------

      - name: Gitleaks summary
        if: always()
        run: |

          echo "# 🔐 Gitleaks Secret Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          COUNT=$(jq '[.runs[]?.results[]?] | length' gitleaks.sarif)

          if [ "$COUNT" -eq 0 ]; then

            echo "## ✅ No secrets detected" >> "$GITHUB_STEP_SUMMARY"

          else

            echo "## ❌ $COUNT potential secret(s) detected" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            echo "| Rule | File | Line | Description |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|---:|---|" >> "$GITHUB_STEP_SUMMARY"

            jq -r '
              .runs[]?.results[]? |
              [
                (.ruleId // "unknown"),
                (.locations[0].physicalLocation.artifactLocation.uri // "unknown"),
                (.locations[0].physicalLocation.region.startLine // "?"),
                (.message.text // "Secret detected")
              ] |
              "| \(.[] | tostring | gsub("\\|"; "\\|")) |"
            ' gitleaks.sarif >> "$GITHUB_STEP_SUMMARY"

          fi


  # ============================================================
  # TRUFFLEHOG
  # ============================================================

  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      # ----------------------------------------------------------
      # Run TruffleHog
      #
      # Scanner is allowed to report findings without directly
      # failing the workflow.
      # ----------------------------------------------------------

      - name: Run TruffleHog
        id: trufflehog
        continue-on-error: true
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: >-
            --results=verified,unknown
            --no-update


      # ----------------------------------------------------------
      # Generate SARIF report
      # ----------------------------------------------------------

      - name: Generate TruffleHog SARIF
        if: always()
        continue-on-error: true
        run: |

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            ghcr.io/trufflesecurity/trufflehog:latest \
            filesystem /repo \
            --results=verified,unknown \
            --sarif \
            --no-update \
            > trufflehog.sarif


      # ----------------------------------------------------------
      # Upload TruffleHog SARIF
      # ----------------------------------------------------------

      - name: Upload TruffleHog SARIF to GitHub Code Scanning
        if: always() && hashFiles('trufflehog.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trufflehog.sarif
          category: trufflehog


      # ----------------------------------------------------------
      # Upload report artifact
      # ----------------------------------------------------------

      - name: Upload TruffleHog report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-report
          path: trufflehog.sarif
          if-no-files-found: warn


      # ----------------------------------------------------------
      # TruffleHog summary
      # ----------------------------------------------------------

      - name: TruffleHog summary
        if: always()
        run: |

          echo "# 🐷 TruffleHog Secret Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ ! -s trufflehog.sarif ]; then

            echo "⚠️ TruffleHog did not generate a SARIF report." \
              >> "$GITHUB_STEP_SUMMARY"

            exit 0

          fi

          COUNT=$(jq '[.runs[]?.results[]?] | length' trufflehog.sarif)

          if [ "$COUNT" -eq 0 ]; then

            echo "## ✅ No secrets detected" >> "$GITHUB_STEP_SUMMARY"

          else

            echo "## ❌ $COUNT potential secret(s) detected" \
              >> "$GITHUB_STEP_SUMMARY"

            echo "" >> "$GITHUB_STEP_SUMMARY"

            echo "| Rule | File | Line | Description |" \
              >> "$GITHUB_STEP_SUMMARY"

            echo "|---|---|---:|---|" \
              >> "$GITHUB_STEP_SUMMARY"

            jq -r '
              .runs[]?.results[]? |
              [
                (.ruleId // "unknown"),
                (.locations[0].physicalLocation.artifactLocation.uri // "unknown"),
                (.locations[0].physicalLocation.region.startLine // "?"),
                (.message.text // "Secret detected")
              ] |
              "| \(.[] | tostring | gsub("\\|"; "\\|")) |"
            ' trufflehog.sarif >> "$GITHUB_STEP_SUMMARY"

          fi
